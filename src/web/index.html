<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)">
<title>ORBIT</title>
<link rel="icon" href="/avatar.png">
<link rel="apple-touch-icon" href="/avatar.png">
<style>
  /* Colors from the ORBIT avatar: deep space, violet and electric-blue ribbons, gold filaments. */
  :root {
    --bg: #f4f2fb; --bg-glow: rgba(124, 92, 230, 0.14); --fg: #1c1838; --muted: #5d5880;
    --line: #dcd6f0; --card: #ffffff; --accent: #6d4fd8; --accent-2: #2f8fd6; --on-accent: #ffffff;
    --live: #1b7fb8; --mock: #9a6a00; --down: #c2334d; --gold: #c9921f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080a1a; --bg-glow: rgba(124, 92, 230, 0.22); --fg: #e9e6ff; --muted: #9c97c4;
      --line: #252a4d; --card: #11142b; --accent: #8b6cf0; --accent-2: #6fc3ff; --on-accent: #0b0d1f;
      --live: #6fc3ff; --mock: #f2c46d; --down: #ff7a8a; --gold: #f2c46d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, var(--bg-glow), transparent 70%), var(--bg);
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .brand img { width: 30px; height: 30px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1px var(--line), 0 0 12px var(--bg-glow); }
  h1 {
    margin: 0; font-size: 16px; letter-spacing: .18em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #ports { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--card); }
  .pill::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: currentColor; vertical-align: middle; }
  .live { color: var(--live); } .mock { color: var(--mock); } .degraded, .down { color: var(--down); }
  #inbox { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .note { border-left: 3px solid var(--gold); padding: 4px 8px; background: var(--card); border-radius: 4px; white-space: pre-wrap; }
  #signin:not(:empty) { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  #signin button { padding: 4px 12px; margin-top: 4px; }
  #signin code { font-size: 16px; letter-spacing: .12em; color: var(--gold); }
  #signin a { color: var(--accent-2); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 720px; padding: 8px 12px; border-radius: 12px; background: var(--card);
         border: 1px solid var(--line); white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .tag { display: block; font-size: 11px; margin-top: 4px; }
  .calls { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .calls div { margin-top: 2px; }
  .proposal { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--gold); border-radius: 8px; background: var(--bg); }
  .proposal pre { margin: 4px 0; white-space: pre-wrap; max-height: 240px; overflow-y: auto; font: 12px/1.4 ui-monospace, monospace; }
  .proposal button { padding: 4px 12px; margin-right: 6px; }
  .proposal button.cancel { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
  nav { display: flex; gap: 6px; margin-bottom: 8px; }
  nav button { padding: 4px 14px; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  nav button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); border-color: transparent; }
  #jobs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #jobs h2 { margin: 6px 0 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card { max-width: 720px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .card.bad { border-color: var(--down); }
  .card.warn { border-color: var(--mock); }
  .card .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .card .id { font: 600 13px ui-monospace, monospace; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .latest { margin-top: 4px; font-size: 14px; }
  .card a { color: var(--accent-2); }
  .card button.open { margin-top: 6px; padding: 4px 12px; }
  .health-not-started, .health-quiet { color: var(--mock); font-weight: 600; }
  .health-launch-failed { color: var(--down); font-weight: 600; }
  .health-ok { color: var(--live); }
  .ev { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); white-space: pre-wrap; }
  .ev:first-child { border-top: 0; }
  #jobs textarea { width: 100%; }
  #jobs .steerbox { display: flex; flex-direction: column; gap: 6px; }
  #jobs .steerbox button { align-self: flex-start; padding: 6px 16px; }
  #jobs button.back, #jobs button.cancel { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 4px 12px; align-self: flex-start; }
  #jobs .empty { color: var(--muted); }
  @media (max-width: 480px) { #jobs, #log { padding: 12px; } .card { padding: 8px 10px; } }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 0 16px; border-radius: 10px; border: 0; color: var(--on-accent);
           background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
</style>
</head>
<body>
<header><div class="brand"><img src="/avatar.png" alt=""><h1>ORBIT</h1></div><nav id="tabs" hidden><button type="button" data-tab="chat" aria-pressed="true">Chat</button><button type="button" data-tab="jobs" aria-pressed="false">Jobs <span id="jobsbadge"></span></button></nav><div id="ports"></div><div id="signin"></div><div id="inbox"></div></header>
<main id="log"></main>
<section id="jobs" hidden aria-live="off"></section>
<form id="form"><textarea id="input" rows="2" placeholder="Message ORBIT" required></textarea><button>Send</button></form>
<script>
  const history = [];
  const log = document.getElementById("log");

  async function refreshStatus() {
    try {
      const s = await (await fetch("/status")).json();
      const box = document.getElementById("ports");
      box.replaceChildren(...s.ports.map((p) => {
        const el = document.createElement("span");
        el.className = `pill ${p.state}`;
        el.textContent = `${p.port}: ${p.state}`;
        el.title = p.detail;
        return el;
      }));
    } catch { /* the next refresh tries again */ }
  }

  function showCalls(el, calls) {
    if (!calls?.length) return;
    const box = document.createElement("span");
    box.className = "calls";
    box.append(`Tool calls (${calls.length}):`);
    for (const c of calls) {
      const row = document.createElement("div");
      const src = c.ok ? `${c.provenance} · ${c.source}` : "failed";
      row.textContent = `${c.ok ? "✓" : "✗"} ${c.name}(${JSON.stringify(c.args).slice(0, 120)}) [${src}] ${c.summary.slice(0, 160)}`;
      box.append(row);
    }
    el.append(box);
  }

  function showProposal(el, p) {
    const box = document.createElement("div");
    box.className = "proposal";
    const head = document.createElement("div");
    const steer = p.kind === "job_steer";
    head.textContent = steer ? `Proposed steer for job ${p.job}. Nothing has been sent yet.` : `Proposed job on routine "${p.routine}". Nothing has launched yet.`;
    const brief = document.createElement("pre");
    brief.textContent = steer ? p.text : p.brief;
    const status = document.createElement("div");
    const done = (text) => { box.replaceChildren(head, brief, Object.assign(document.createElement("div"), { textContent: text })); };
    const act = async (verb) => {
      confirm.disabled = cancel.disabled = true;
      try {
        const res = await fetch(`/chat/proposals/${p.id}/${verb}`, { method: "POST" });
        const body = await res.json();
        if (!res.ok) return done(`${verb === "confirm" ? (steer ? "Steer failed" : "Launch failed") : "Not cancelled"}: ${body.error}`);
        done(verb === "cancel" ? "Cancelled." : steer ? `Steer ${body.steer.n} queued for ${body.steered}; the job picks it up at its next check-in.` : `Launched job ${body.id}${body.launch?.sessionUrl ? " · " + body.launch.sessionUrl : ""}. Ask ORBIT for its status.`);
      } catch { done("ORBIT did not answer."); }
    };
    const confirm = Object.assign(document.createElement("button"), { type: "button", textContent: "Confirm" });
    const cancel = Object.assign(document.createElement("button"), { type: "button", textContent: "Cancel", className: "cancel" });
    confirm.addEventListener("click", () => act("confirm"));
    cancel.addEventListener("click", () => act("cancel"));
    box.append(head, brief, confirm, cancel, status);
    el.append(box);
  }

  function add(role, text, tag, tagClass, extra) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    if (tag) {
      const t = document.createElement("span");
      t.className = `tag ${tagClass}`;
      t.textContent = tag;
      el.append(t);
    }
    if (extra) { showCalls(el, extra.calls); for (const p of extra.proposals ?? []) showProposal(el, p); }
    log.append(el);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const content = input.value.trim();
    if (!content) return;
    input.value = "";
    history.push({ role: "user", content });
    add("user", content);
    try {
      const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" },
                                          body: JSON.stringify({ messages: history.slice(-40) }) });
      const body = await res.json();
      if (!res.ok) { add("orbit", body.error, "error", "down"); history.pop(); return; }
      history.push({ role: "assistant", content: body.reply.value });
      const mem = body.memory?.length ? ` · memory: ${body.memory.join(", ")}` : "";
      add("orbit", body.reply.value, `${body.reply.provenance} · ${body.reply.source}${mem}`, body.reply.provenance, body);
    } catch { add("orbit", "ORBIT did not answer.", "error", "down"); history.pop(); }
    refreshStatus();
  });

  document.getElementById("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  });
  // Shows due notifications, then acknowledges each so ORBIT records a shown receipt.
  async function refreshInbox() {
    try {
      const res = await fetch("/notifications");
      if (!res.ok) return;
      const { inbox } = await res.json();
      for (const n of inbox) {
        const el = document.createElement("div");
        el.className = "note";
        el.textContent = n.text;
        document.getElementById("inbox").append(el);
        await fetch(`/notifications/${n.id}/ack`, { method: "POST" });
      }
    } catch { /* the next refresh tries again */ }
  }

  // ChatGPT sign-in, owner only: the same device-code flow OpenClaw uses.
  async function refreshSignin() {
    const box = document.getElementById("signin");
    try {
      const res = await fetch("/model/login");
      if (!res.ok) { box.replaceChildren(); return; }
      const login = await res.json();
      if (login.state === "signed-in") { box.replaceChildren(); return; }
      if (login.state === "pending") {
        box.innerHTML = "";
        const steps = document.createElement("div");
        steps.append("1. ", Object.assign(document.createElement("a"), { href: login.authorizeUrl, target: "_blank", rel: "noopener", textContent: "Open ChatGPT sign-in" }), " and approve ORBIT.");
        steps.append(document.createElement("br"), "2. The browser then lands on a localhost:8080 page that will not load. Copy that address and paste it here:");
        const field = Object.assign(document.createElement("input"), { placeholder: "http://localhost:8080/auth/callback?...", type: "url" });
        field.style.cssText = "width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit";
        const finish = Object.assign(document.createElement("button"), { textContent: "Finish sign-in" });
        finish.addEventListener("click", async () => {
          const res = await fetch("/model/login/callback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: field.value }) });
          await res.json();
          refreshSignin();
          refreshStatus();
        });
        box.append(steps, field, document.createElement("br"), finish);
        return;
      }
      box.innerHTML = "";
      const why = login.state === "failed" ? `Sign-in failed: ${login.detail}. ` : "";
      box.append(why + "Replies are not real until ORBIT is signed in to ChatGPT.");
      const button = Object.assign(document.createElement("button"), { textContent: "Sign in with ChatGPT" });
      button.addEventListener("click", async () => { await fetch("/model/login", { method: "POST" }); refreshSignin(); });
      box.append(document.createElement("br"), button);
    } catch { /* the next refresh tries again */ }
  }


  // ---- Jobs view (owner only). The tabs appear only when the owner routes answer. ----
  const jobsBox = document.getElementById("jobs");
  const tabs = document.getElementById("tabs");
  const chatForm = document.getElementById("form");
  let tab = "chat";
  let openJob = null;      // job id whose detail is showing
  const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  const ago = (iso) => {
    if (!iso) return "never";
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    return s < 90 ? `${Math.round(s)}s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  };
  const safeLink = (url, text) => /^https:\/\/(claude\.ai|github\.com)\//.test(url || "")
    ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer", textContent: text }) : null;

  function setTab(next) {
    tab = next;
    for (const b of tabs.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.tab === next));
    document.getElementById("log").hidden = next !== "chat";
    chatForm.hidden = next !== "chat";
    jobsBox.hidden = next !== "jobs";
    if (next === "jobs") jobsPoller.poll();
  }
  tabs.addEventListener("click", (e) => { const t = e.target.closest("button")?.dataset.tab; if (t) setTab(t); });

  function jobCard(r) {
    const bad = r.health === "launch-failed", warn = r.health === "not-started" || r.health === "quiet";
    const card = el("div", { className: `card${bad ? " bad" : warn ? " warn" : ""}` });
    const row = el("div", { className: "row" }, el("span", { className: "id", textContent: r.id }), el("span", { textContent: r.state }),
      el("span", { className: `health-${r.health}`, textContent: r.health }));
    const link = safeLink(r.sessionUrl, "session on claude.ai");
    if (link) row.append(link);
    const pr = safeLink(r.prUrl, "pull request");
    if (pr) row.append(pr); else if (r.prOpening) row.append(el("span", { className: "meta", textContent: "opening pull request…" }));
    card.append(row);
    if (r.prError) card.append(el("div", { className: "latest health-launch-failed", textContent: `Pull request not opened: ${r.prError}` }));
    if (r.launchError) card.append(el("div", { className: "latest health-launch-failed", textContent: r.launchError }));
    card.append(el("div", { className: "latest", textContent: r.latest?.text || (r.latest ? `${r.latest.type}${r.latest.status ? ": " + r.latest.status : ""}` : "No report yet") }));
    const reported = r.latest ? `reported ${ago(r.latest.at)} through ${r.latest.via === "git" ? "git" : "the API"}` : `launched ${ago(r.launchedAt)}; nothing reported`;
    card.append(el("div", { className: "meta", textContent: reported + (r.pendingSteers ? ` · ${r.pendingSteers} steer(s) waiting` : "") }));
    card.append(el("button", { type: "button", className: "open", textContent: "Open", onclick: () => { openJob = r.id; steerNote = ""; refreshJobs(); } }));
    return card;
  }

  function proposalBox(p) {
    const holder = el("div", { className: "card" });
    showProposal(holder, p);
    const box = holder.querySelector(".proposal");
    // After an answer, drop the card on the next refresh instead of leaving a stale Confirm button.
    box.addEventListener("click", () => setTimeout(refreshJobs, 1500));
    return holder;
  }

  let steerDraft = "", steerNote = "";
  async function renderDetail(id) {
    const res = await fetch(`/jobs/${encodeURIComponent(id)}`);
    if (!res.ok) { openJob = null; return renderList(); }
    const j = await res.json();
    const existing = jobsBox.querySelector("textarea.steer");
    if (existing) steerDraft = existing.value;
    const events = el("div", { className: "card" }, ...(j.events.length ? [...j.events].reverse().slice(0, 100).map((ev) =>
      el("div", { className: "ev", textContent: `${ago(ev.at)} · ${ev.type}${ev.status ? " " + ev.status : ""} · ${ev.via === "git" ? "git" : "API"}${ev.text ? "\n" + ev.text : ""}` })) : [el("div", { className: "empty", textContent: "No events yet." })]));
    const steers = el("div", { className: "card" }, ...(j.steers.length ? [...j.steers].reverse().map((s) =>
      el("div", { className: "ev", textContent: `#${s.n} · ${ago(s.at)} · ${s.deliveredAt ? "picked up " + ago(s.deliveredAt) : "waiting for the runner"}\n${s.text}` })) : [el("div", { className: "empty", textContent: "No steers yet." })]));
    const area = el("textarea", { className: "steer", rows: 3, placeholder: "Steer this job. It picks the message up at its next check-in." });
    area.value = steerDraft;
    const status = el("div", { className: "meta", textContent: steerNote });
    const send = el("button", { type: "button", textContent: "Send steer" });
    send.addEventListener("click", async () => {
      const text = area.value.trim();
      if (!text) return;
      send.disabled = true;
      try {
        const r = await fetch(`/jobs/${encodeURIComponent(id)}/steer`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
        const b = await r.json();
        if (!r.ok) { steerNote = status.textContent = `Not sent: ${b.error}`; }
        else { steerDraft = ""; area.value = ""; steerNote = status.textContent = `Steer ${b.n} queued.`; refreshJobs(); }
      } catch { status.textContent = "ORBIT did not answer."; }
      send.disabled = false;
    });
    const head = el("div", { className: "card" + (j.health === "launch-failed" ? " bad" : "") },
      el("div", { className: "row" }, el("span", { className: "id", textContent: j.id }), el("span", { textContent: j.state }), el("span", { className: `health-${j.health}`, textContent: j.health }),
        ...[safeLink(j.launch?.sessionUrl, "session on claude.ai"), safeLink(j.pr?.url, "pull request")].filter(Boolean)),
      ...(j.pr?.error ? [el("div", { className: "latest health-launch-failed", textContent: `Pull request not opened: ${j.pr.error}` })] : []));
    jobsBox.replaceChildren(
      el("button", { type: "button", className: "back", textContent: "← All jobs", onclick: () => { openJob = null; refreshJobs(); } }),
      head, el("h2", { textContent: "Steer" }), el("div", { className: "card steerbox" }, area, send, status),
      el("h2", { textContent: "Steers" }), steers, el("h2", { textContent: "Events (newest first)" }), events);
  }

  async function renderList() {
    const [jr, pr] = await Promise.all([fetch("/jobs?view=rows"), fetch("/chat/proposals")]);
    if (!jr.ok) { tabs.hidden = true; setTab("chat"); return; }
    const rows = (await jr.json()).jobs;
    const proposals = pr.ok ? (await pr.json()).proposals : [];
    const attention = rows.filter((r) => ["not-started", "quiet", "launch-failed"].includes(r.health)).length + proposals.length;
    document.getElementById("jobsbadge").textContent = attention ? `(${attention})` : "";
    jobsBox.replaceChildren(
      ...(proposals.length ? [el("h2", { textContent: `Waiting for your click (${proposals.length})` }), ...proposals.map(proposalBox)] : []),
      el("h2", { textContent: `Jobs (${rows.length})` }),
      ...(rows.length ? rows.map(jobCard) : [el("div", { className: "empty", textContent: "No jobs yet." })]));
  }

  // <poller>
  // Runs `refresh` when `shouldRun()` says so, never two at once. Tests load this block on its own.
  function makePoller(refresh, shouldRun, schedule, ms) {
    let busy = false;
    const poll = async () => {
      if (busy || !shouldRun()) return;
      busy = true;
      try { await refresh(); } finally { busy = false; }
    };
    return { poll, start: () => schedule(poll, ms) };
  }
  // </poller>

  // Fetches and draws the Jobs tab. Called by the poller and by the user's own clicks on that tab.
  async function refreshJobs() {
    try {
      if (openJob) await renderDetail(openJob); else await renderList();
    } catch { /* the next refresh tries again */ }
  }
  // The Jobs tab refreshes once when it opens and every 15 seconds while it is showing and the page is visible.
  // The Chat tab and a hidden page make no jobs requests.
  const jobsPoller = makePoller(refreshJobs, () => tab === "jobs" && document.visibilityState === "visible", setInterval, 15000);
  jobsPoller.start();

  // The tabs show only for the owner. /chat/proposals is owner-only and cheap, so it answers that once on load
  // without touching the jobs list; the badge fills in when the Jobs tab opens.
  (async () => {
    try {
      const pr = await fetch("/chat/proposals");
      tabs.hidden = !pr.ok;
      if (pr.ok) { const n = (await pr.json()).proposals.length; document.getElementById("jobsbadge").textContent = n ? `(${n})` : ""; }
    } catch { /* stay on Chat */ }
  })();

  refreshStatus();
  refreshInbox();
  refreshSignin();
  setInterval(refreshStatus, 30000);
  setInterval(refreshInbox, 30000);
</script>
</body>
</html>
