<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)">
<title>ORBIT</title>
<link rel="icon" href="/avatar.png">
<link rel="apple-touch-icon" href="/avatar.png">
<style>
  /* Colors from the ORBIT avatar: deep space, violet and electric-blue ribbons, gold filaments. */
  :root {
    --bg: #f4f2fb; --bg-glow: rgba(124, 92, 230, 0.14); --fg: #1c1838; --muted: #5d5880;
    --line: #dcd6f0; --card: #ffffff; --accent: #6d4fd8; --accent-2: #2f8fd6; --on-accent: #ffffff;
    --live: #1b7fb8; --mock: #9a6a00; --down: #c2334d; --gold: #c9921f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080a1a; --bg-glow: rgba(124, 92, 230, 0.22); --fg: #e9e6ff; --muted: #9c97c4;
      --line: #252a4d; --card: #11142b; --accent: #8b6cf0; --accent-2: #6fc3ff; --on-accent: #0b0d1f;
      --live: #6fc3ff; --mock: #f2c46d; --down: #ff7a8a; --gold: #f2c46d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, var(--bg-glow), transparent 70%), var(--bg);
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .brand img { width: 30px; height: 30px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1px var(--line), 0 0 12px var(--bg-glow); }
  h1 {
    margin: 0; font-size: 16px; letter-spacing: .18em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #ports { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--card); }
  .pill::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: currentColor; vertical-align: middle; }
  .live { color: var(--live); } .mock { color: var(--mock); } .degraded, .down { color: var(--down); }
  #inbox { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; }
  .note { border-left: 3px solid var(--gold); padding: 4px 8px; background: var(--card); border-radius: 4px; overflow-wrap: anywhere; }
  .note .top { display: flex; gap: 6px; align-items: flex-start; }
  .note .first { flex: 1; min-width: 0; }
  .note .rest { margin-top: 4px; white-space: pre-wrap; font-size: 14px; }
  .note button { flex: none; background: none; border: 0; padding: 2px 6px; min-height: 24px; color: var(--accent-2); font: inherit; font-size: 13px; cursor: pointer; }
  .note button.x { color: var(--muted); font-size: 16px; line-height: 1; }
  .note a, .ev a, .latest a { color: var(--accent-2); }
  #inbox .showall { align-self: flex-start; background: none; border: 0; padding: 2px 0; color: var(--accent-2); font: inherit; font-size: 13px; cursor: pointer; }
  #threadbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  #threadbar select { flex: 1 1 160px; min-width: 0; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  #threadbar button { padding: 5px 12px; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  #threadbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .banner { align-self: stretch; max-width: 720px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--gold); background: var(--card); font-size: 14px; overflow-wrap: anywhere; }
  .banner button { margin-top: 6px; padding: 4px 12px; display: block; }
  .compact { align-self: stretch; max-width: 720px; padding: 6px 10px; border-radius: 10px; border: 1px dashed var(--line); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .compact pre { white-space: pre-wrap; margin: 4px 0 0; font: 12px/1.4 ui-monospace, monospace; }
  .compact .warn, .dup { color: var(--mock); font-weight: 600; }
  .cardstate { margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; }
  .cardstate .ok { color: var(--live); } .cardstate .bad { color: var(--down); }
  .proposal.closed { border-color: var(--line); }
  #signin:not(:empty) { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  #signin button { padding: 4px 12px; margin-top: 4px; }
  #signin code { font-size: 16px; letter-spacing: .12em; color: var(--gold); }
  #signin a { color: var(--accent-2); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 720px; padding: 8px 12px; border-radius: 12px; background: var(--card);
         border: 1px solid var(--line); white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .msg a { color: var(--accent-2); overflow-wrap: anywhere; }
  .msg.user a { color: inherit; text-decoration: underline; }
  .tag { display: block; font-size: 11px; margin-top: 4px; }
  .calls { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .calls div { margin-top: 2px; }
  .proposal { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--gold); border-radius: 8px; background: var(--bg); }
  .proposal pre { margin: 4px 0; white-space: pre-wrap; max-height: 240px; overflow-y: auto; font: 12px/1.4 ui-monospace, monospace; }
  .proposal button { padding: 4px 12px; margin-right: 6px; }
  .proposal button.cancel { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
  nav { display: flex; gap: 6px; margin-bottom: 8px; }
  nav button { padding: 4px 14px; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  nav button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); border-color: transparent; }
  #jobs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #jobs h2 { margin: 6px 0 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card { max-width: 720px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .card.bad { border-color: var(--down); }
  .card.warn { border-color: var(--mock); }
  .card .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .card .id { font: 600 13px ui-monospace, monospace; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .latest { margin-top: 4px; font-size: 14px; }
  .card a { color: var(--accent-2); }
  .card button.open { margin-top: 6px; padding: 4px 12px; }
  .health-not-started, .health-quiet { color: var(--mock); font-weight: 600; }
  .health-launch-failed { color: var(--down); font-weight: 600; }
  .health-ok { color: var(--live); }
  .ev { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); white-space: pre-wrap; }
  .ev:first-child { border-top: 0; }
  #jobs textarea { width: 100%; }
  #jobs .steerbox { display: flex; flex-direction: column; gap: 6px; }
  #jobs .steerbox button { align-self: flex-start; padding: 6px 16px; }
  #jobs button.back, #jobs button.cancel { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 4px 12px; align-self: flex-start; }
  #jobs .empty { color: var(--muted); }
  @media (max-width: 480px) { #jobs, #log { padding: 12px; } .card { padding: 8px 10px; } }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 0 16px; border-radius: 10px; border: 0; color: var(--on-accent);
           background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
</style>
</head>
<body>
<header><div class="brand"><img src="/avatar.png" alt=""><h1>ORBIT</h1></div><nav id="tabs" hidden><button type="button" data-tab="chat" aria-pressed="true">Chat</button><button type="button" data-tab="jobs" aria-pressed="false">Jobs <span id="jobsbadge"></span></button></nav><div id="threadbar" hidden><select id="threadsel" aria-label="Thread"></select><button type="button" id="tnew">New</button><button type="button" id="trename">Rename</button><button type="button" id="tarchive">Archive</button><label><input type="checkbox" id="tshowarch"> archived</label></div><div id="ports"></div><div id="signin"></div><div id="inbox"></div></header>
<main id="log"></main>
<section id="jobs" hidden aria-live="off"></section>
<form id="form"><textarea id="input" rows="2" placeholder="Message ORBIT" required></textarea><button>Send</button></form>
<script>
  const history = [];
  const log = document.getElementById("log");

  async function refreshStatus() {
    try {
      const s = await (await fetch("/status")).json();
      const box = document.getElementById("ports");
      box.replaceChildren(...s.ports.map((p) => {
        const el = document.createElement("span");
        el.className = `pill ${p.state}`;
        el.textContent = `${p.port}: ${p.state}`;
        el.title = p.detail;
        return el;
      }));
    } catch { /* the next refresh tries again */ }
  }

  function showCalls(el, calls) {
    if (!calls?.length) return;
    const box = document.createElement("span");
    box.className = "calls";
    box.append(`Tool calls (${calls.length}):`);
    for (const c of calls) {
      const row = document.createElement("div");
      const src = c.ok ? `${c.provenance} · ${c.source}` : "failed";
      row.textContent = `${c.ok ? "✓" : "✗"} ${c.name}(${JSON.stringify(c.args).slice(0, 120)}) [${src}] ${c.summary.slice(0, 160)}`;
      box.append(row);
    }
    el.append(box);
  }

  function showProposal(el, p, after) {
    const box = document.createElement("div");
    box.className = "proposal";
    const head = document.createElement("div");
    const steer = p.kind === "job_steer";
    const sysop = p.kind === "ops_sys";
    const vault = p.kind === "vault_edit";
    const ops = p.kind === "ops_admin" || sysop || vault;
    head.textContent = vault ? `Proposed vault change: ${p.summary} Nothing has been written yet.` : ops ? `Proposed server action: ${p.summary} Nothing has been done yet.` : steer ? `Proposed steer for job ${p.job}. Nothing has been sent yet.` : `Proposed job on routine "${p.routine}". Nothing has launched yet.`;
    const brief = document.createElement("pre");
    brief.textContent = vault ? `${Object.entries(p.display || {}).map(([k, v]) => `${k}: ${v}`).join("\n")}\n\ndigest ${p.digest.slice(0, 16)}` : sysop ? `${p.display ? Object.entries(p.display).map(([k, v]) => `${k}=${v}`).join("\n") : p.action}\n\n${(p.warnings || []).map((w) => `! ${w}`).join("\n\n")}\n\ndigest ${p.digest.slice(0, 16)}` : ops ? (p.display ? Object.entries(p.display).map(([k, v]) => `${k}=${v}`).join("\n") : p.action) + `\n\ndigest ${p.digest.slice(0, 16)}`  : steer ? p.text : p.brief;
    const status = document.createElement("div");
    const dups = (p.duplicates || []).map((d) => Object.assign(document.createElement("div"), { className: "dup", textContent: `Possible duplicate: this brief is ${Math.round(d.similarity * 100)}% similar to job ${d.job} (${d.state}), launched ${d.launchedAt || "recently"}. Check before confirming.` }));
    const done = (text) => { box.replaceChildren(head, brief, Object.assign(document.createElement("div"), { textContent: text })); if (after) after(); };
    const act = async (verb) => {
      confirm.disabled = cancel.disabled = true;
      try {
        const res = await fetch(`/chat/proposals/${p.id}/${verb}`, ops && verb === "confirm"
          ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ digest: p.digest }) }
          : { method: "POST" });
        const body = await res.json();
        if (!res.ok) return done(`${verb === "confirm" ? (ops ? (vault ? "Not saved" : "Not dispatched") : steer ? "Steer failed" : "Launch failed") : "Not cancelled"}: ${body.error}`);
        done(verb === "cancel" ? "Cancelled." : vault ? `Committed and pushed. ORBIT read the remote branch back: it points at commit ${String(body.commit).slice(0, 7)}.` : ops ? "Dispatched to the server helper. This is NOT verified yet: ORBIT will report the verified result when it has it (ask it for the operations)." : steer ? `Steer ${body.steer.n} queued for ${body.steered}; the job picks it up at its next check-in.` : `Launched job ${body.id}${body.launch?.sessionUrl ? " · " + body.launch.sessionUrl : ""}. Ask ORBIT for its status.`);
      } catch { done("ORBIT did not answer."); }
    };
    const confirm = Object.assign(document.createElement("button"), { type: "button", textContent: "Confirm" });
    const cancel = Object.assign(document.createElement("button"), { type: "button", textContent: "Cancel", className: "cancel" });
    confirm.addEventListener("click", () => act("confirm"));
    cancel.addEventListener("click", () => act("cancel"));
    box.append(head, ...dups, brief, confirm, cancel, status);
    el.append(box);
  }

  function add(role, text, tag, tagClass, extra) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    if (tag) {
      const t = document.createElement("span");
      t.className = `tag ${tagClass}`;
      t.textContent = tag;
      el.append(t);
    }
    if (extra) { showCalls(el, extra.calls); for (const p of extra.proposals ?? []) showProposal(el, p); }
    log.append(el);
    log.scrollTop = log.scrollHeight;
  }

  // ---- Threads (owner): stored on the server, shared by every device. The page keeps only the selected id (per device). ----
  const THREAD_KEY = "orbit.thread";
  let threadMode = null;      // null until known; "server" for the owner, "legacy" for anyone else (no stored history)
  let threadList = [];
  let current = null;         // the thread being shown, as the server sent it
  let sending = false;
  let showArchived = false;
  const tsel = document.getElementById("threadsel");
  const readSel = () => { try { return localStorage.getItem(THREAD_KEY); } catch { return null; } };
  const writeSel = (id) => { try { id ? localStorage.setItem(THREAD_KEY, id) : localStorage.removeItem(THREAD_KEY); } catch { /* per-device convenience only */ } };

  async function tapi(path, method, body) {
    const res = await fetch(path, method === "GET" ? undefined : { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
    let data = {};
    try { data = await res.json(); } catch { /* not JSON */ }
    return { ok: res.ok, status: res.status, data };
  }

  function renderBar() {
    const rows = threadList.filter((t) => showArchived || !t.archived || t.id === current?.id);
    tsel.replaceChildren(...rows.map((t) => Object.assign(document.createElement("option"), { value: t.id, textContent: threadOption(t), selected: t.id === current?.id })));
    if (!rows.length) tsel.append(Object.assign(document.createElement("option"), { value: "", textContent: "No threads yet" }));
    document.getElementById("tarchive").textContent = current?.archived ? "Restore" : "Archive";
    document.getElementById("trename").disabled = document.getElementById("tarchive").disabled = !current;
    const input = document.getElementById("input");
    input.disabled = Boolean(current?.archived);
    input.placeholder = current?.archived ? "This thread is archived. Restore it to continue." : "Message ORBIT";
  }

  function renderCard(card) {
    const holder = el("div", { className: "cardwrap" });
    if (card.state === "open") { showProposal(holder, card, () => loadThread(current.id)); return holder; }
    const head = el("div", {}, ...cardTitle(card));
    holder.append(el("div", { className: "proposal closed" }, head, ...(card.brief || card.text ? [el("pre", { textContent: String(card.brief ?? card.text).slice(0, 1200) })] : []), ...cardStateNodes(card, el)));
    return holder;
  }

  function renderThread(view, keepScroll) {
    current = view;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    const byId = new Map(view.cards.map((c) => [c.id, c]));
    const nodes = [];
    if (pendingNotice) nodes.push(noticeBanner(pendingNotice));
    view.messages.forEach((m, i) => {
      if (view.summary && i === view.summary.covers) nodes.push(compactionNode(view, el));
      nodes.push(renderStoredMessage(m, el, (id) => { const c = byId.get(id); return c ? renderCard(c) : null; }));
    });
    if (view.summary && view.summary.covers >= view.messages.length) nodes.push(compactionNode(view, el));
    if (!view.messages.length) nodes.push(el("div", { className: "compact", textContent: "This thread is empty. Messages are saved on ORBIT's server and show on your other devices." }));
    log.replaceChildren(...nodes);
    if (!keepScroll || atBottom) log.scrollTop = log.scrollHeight;
    renderBar();
  }

  let pendingNotice = null;
  function noticeBanner(n) {
    return el("div", { className: "banner", role: "note" }, n.text, el("button", { type: "button", textContent: "Got it", onclick: async () => { await tapi("/threads/notice/ack", "POST"); pendingNotice = null; if (current) renderThread(current, true); else showEmpty(); } }));
  }
  function showEmpty() {
    log.replaceChildren(...(pendingNotice ? [noticeBanner(pendingNotice)] : []), el("div", { className: "compact", textContent: "No thread is open. Send a message to start one; it is saved on ORBIT's server." }));
    renderBar();
  }

  async function loadList() {
    const r = await tapi("/threads?archived=1", "GET");
    if (!r.ok) { if (r.status === 403) threadMode = "legacy"; return false; }
    threadMode = "server";
    threadList = r.data.threads;
    pendingNotice = r.data.notice;
    document.getElementById("threadbar").hidden = false;
    return true;
  }
  async function loadThread(id, keepScroll) {
    const r = await tapi(`/threads/${encodeURIComponent(id)}`, "GET");
    if (!r.ok) { if (r.status === 404) { writeSel(null); current = null; } return false; }
    writeSel(id);
    renderThread(r.data.thread, keepScroll);
    return true;
  }
  async function initThreads() {
    if (!(await loadList())) return;
    const wanted = readSel();
    const first = threadList.find((t) => t.id === wanted) || threadList.find((t) => !t.archived);
    if (first && (await loadThread(first.id))) return;
    current = null;
    showEmpty();
  }
  async function pollThreads() {
    try {
      await loadList();
      if (current) {
        const meta = threadList.find((t) => t.id === current.id);
        // Re-draw when another device changed the thread, or while a confirmed card's live state can still change.
        if (meta && (meta.rev !== current.rev || meta.busy !== current.busy || current.cards.some((c) => c.state === "confirmed"))) await loadThread(current.id, true);
      }
      renderBar();
    } catch { /* the next poll tries again */ }
  }

  tsel.addEventListener("change", () => { if (tsel.value) loadThread(tsel.value); });
  document.getElementById("tshowarch").addEventListener("change", (e) => { showArchived = e.target.checked; renderBar(); });
  document.getElementById("tnew").addEventListener("click", async () => {
    const r = await tapi("/threads", "POST", {});
    if (!r.ok) return;
    await loadList();
    renderThread(r.data.thread);
    writeSel(r.data.thread.id);
    document.getElementById("input").focus();
  });
  document.getElementById("trename").addEventListener("click", async () => {
    if (!current) return;
    const title = window.prompt("Rename thread", current.title);
    if (!title || !title.trim()) return;
    const r = await tapi(`/threads/${current.id}/rename`, "POST", { title });
    if (r.ok) { await loadList(); renderThread(r.data.thread, true); }
  });
  document.getElementById("tarchive").addEventListener("click", async () => {
    if (!current) return;
    const restoring = current.archived;
    const r = await tapi(`/threads/${current.id}/archive`, "POST", { archived: !restoring });
    if (!r.ok) { add("orbit", r.data.error || "Could not archive.", "error", "down"); return; }
    await loadList();
    if (restoring) return renderThread(r.data.thread);
    const next = threadList.find((t) => !t.archived);
    if (next) await loadThread(next.id); else { current = null; writeSel(null); showEmpty(); }
  });

  async function sendThreaded(content) {
    sending = true;
    try {
      if (!current) {
        const made = await tapi("/threads", "POST", {});
        if (!made.ok) { add("orbit", made.data.error || "Could not start a thread.", "error", "down"); return; }
        current = made.data.thread;
        writeSel(current.id);
      }
      log.append(el("div", { className: "msg user", textContent: content }), el("div", { className: "msg orbit", textContent: "Working…" }));
      log.scrollTop = log.scrollHeight;
      const r = await tapi(`/threads/${current.id}/messages`, "POST", { text: content });
      if (r.data.thread) renderThread(r.data.thread);
      else { await loadThread(current.id); add("orbit", r.data.error || "ORBIT did not answer.", "error", "down"); }
      if (!r.ok && r.data.error) add("orbit", r.data.error, "error", "down");
      await loadList();
      renderBar();
    } catch { add("orbit", "ORBIT did not answer.", "error", "down"); }
    finally { sending = false; }
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const content = input.value.trim();
    if (!content || sending) return;
    input.value = "";
    if (threadMode === "server") { await sendThreaded(content); refreshStatus(); return; }
    history.push({ role: "user", content });
    add("user", content);
    try {
      const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" },
                                          body: JSON.stringify({ messages: history.slice(-40) }) });
      const body = await res.json();
      if (!res.ok) { add("orbit", body.error, "error", "down"); history.pop(); return; }
      history.push({ role: "assistant", content: body.reply.value });
      const mem = body.memory?.length ? ` · memory: ${body.memory.join(", ")}` : "";
      add("orbit", body.reply.value, `${body.reply.provenance} · ${body.reply.source}${mem}`, body.reply.provenance, body);
    } catch { add("orbit", "ORBIT did not answer.", "error", "down"); history.pop(); }
    refreshStatus();
  });

  document.getElementById("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  });
  // Shows due notifications, then acknowledges each so ORBIT records a shown receipt. Each note shows its first line
  // with "more" and "×"; at most 3 show unless "show all". Dismissing only hides the note in this browser.
  const noteList = [];
  let showAllNotes = false;
  const expandedNotes = new Set();
  const dismissedKey = "orbit.dismissed-notes";
  const loadDismissed = () => { try { return new Set(JSON.parse(localStorage.getItem(dismissedKey) || "[]")); } catch { return new Set(); } };
  const saveDismissed = (set) => { try { localStorage.setItem(dismissedKey, JSON.stringify([...set].slice(-200))); } catch { /* private mode: dismissed for this page only */ } };
  const dismissedNotes = loadDismissed();
  function renderInbox() {
    const box = document.getElementById("inbox");
    const { shown, total } = pickNotes(noteList, dismissedNotes, showAllNotes);
    const nodes = shown.map((n) => {
      const { first, rest } = firstLine(n.text);
      const open = expandedNotes.has(n.id);
      const top = el("div", { className: "top" }, el("div", { className: "first" }, ...linkify(first, el)));
      if (rest) top.append(el("button", { type: "button", textContent: open ? "less" : "more", onclick: () => { open ? expandedNotes.delete(n.id) : expandedNotes.add(n.id); renderInbox(); } }));
      top.append(el("button", { type: "button", className: "x", title: "Dismiss", textContent: "×", onclick: () => { dismissedNotes.add(n.id); saveDismissed(dismissedNotes); renderInbox(); } }));
      return el("div", { className: "note" }, top, ...(rest && open ? [el("div", { className: "rest" }, ...linkify(rest, el))] : []));
    });
    if (total > NOTES_SHOWN) nodes.push(el("button", { type: "button", className: "showall", textContent: showAllNotes ? "show fewer" : `show all (${total})`, onclick: () => { showAllNotes = !showAllNotes; renderInbox(); } }));
    box.replaceChildren(...nodes);
  }
  async function refreshInbox() {
    try {
      const res = await fetch("/notifications");
      if (!res.ok) return;
      const { inbox } = await res.json();
      for (const n of inbox) {
        noteList.push({ id: n.id, text: String(n.text ?? "") });
        renderInbox();
        await fetch(`/notifications/${n.id}/ack`, { method: "POST" });
      }
    } catch { /* the next refresh tries again */ }
  }

  // ChatGPT sign-in, owner only: the same device-code flow OpenClaw uses.
  async function refreshSignin() {
    const box = document.getElementById("signin");
    try {
      const res = await fetch("/model/login");
      if (!res.ok) { box.replaceChildren(); return; }
      const login = await res.json();
      if (login.state === "signed-in") { box.replaceChildren(); return; }
      if (login.state === "pending") {
        box.innerHTML = "";
        const steps = document.createElement("div");
        steps.append("1. ", Object.assign(document.createElement("a"), { href: login.authorizeUrl, target: "_blank", rel: "noopener", textContent: "Open ChatGPT sign-in" }), " and approve ORBIT.");
        steps.append(document.createElement("br"), "2. The browser then lands on a localhost:8080 page that will not load. Copy that address and paste it here:");
        const field = Object.assign(document.createElement("input"), { placeholder: "http://localhost:8080/auth/callback?...", type: "url" });
        field.style.cssText = "width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit";
        const finish = Object.assign(document.createElement("button"), { textContent: "Finish sign-in" });
        finish.addEventListener("click", async () => {
          const res = await fetch("/model/login/callback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: field.value }) });
          await res.json();
          refreshSignin();
          refreshStatus();
        });
        box.append(steps, field, document.createElement("br"), finish);
        return;
      }
      box.innerHTML = "";
      const why = login.state === "failed" ? `Sign-in failed: ${login.detail}. ` : "";
      box.append(why + "Replies are not real until ORBIT is signed in to ChatGPT.");
      const button = Object.assign(document.createElement("button"), { textContent: "Sign in with ChatGPT" });
      button.addEventListener("click", async () => { await fetch("/model/login", { method: "POST" }); refreshSignin(); });
      box.append(document.createElement("br"), button);
    } catch { /* the next refresh tries again */ }
  }


  // ---- Jobs view (owner only). The tabs appear only when the owner routes answer. ----
  const jobsBox = document.getElementById("jobs");
  const tabs = document.getElementById("tabs");
  const chatForm = document.getElementById("form");
  let tab = "chat";
  let openJob = null;      // job id whose detail is showing
  const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  const ago = (iso) => {
    if (!iso) return "never";
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    return s < 90 ? `${Math.round(s)}s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  };
  const safeLink = (url, text) => /^https:\/\/(claude\.ai|github\.com)\//.test(url || "")
    ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer", textContent: text }) : null;

  function setTab(next) {
    tab = next;
    for (const b of tabs.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.tab === next));
    document.getElementById("log").hidden = next !== "chat";
    chatForm.hidden = next !== "chat";
    jobsBox.hidden = next !== "jobs";
    if (next === "jobs") jobsPoller.poll();
  }
  tabs.addEventListener("click", (e) => { const t = e.target.closest("button")?.dataset.tab; if (t) setTab(t); });

  // The orbit-job source commit the runner reported. Unknown is shown as unknown; only a known commit that differs
  // from the commit ORBIT is running is flagged. All text goes in through textContent.
  // <tool-commit-badge>
  function toolCommitBadge(r) {
    const known = r.toolCommit && r.toolCommit !== "unknown";
    const status = r.toolCommitStatus === "mismatch" ? " ≠ running ORBIT" : r.toolCommitStatus === "match" ? " (matches ORBIT)" : " (ORBIT's own commit unknown)";
    const text = !known ? "tool commit: unknown" : `tool commit: ${String(r.toolCommit).slice(0, 7)}${status}`;
    const span = el("span", { className: r.toolCommitStatus === "mismatch" ? "health-launch-failed" : "meta", textContent: text });
    // The full commit is the hover text and part of the accessible name, which keeps the visible status (e.g. the
    // mismatch) so the label never drops what the text says; unknown has neither.
    if (known) { span.title = String(r.toolCommit); span.setAttribute("role", "note"); span.setAttribute("aria-label", `tool commit ${String(r.toolCommit)}${status}`); }
    return span;
  }
  // </tool-commit-badge>

  function jobCard(r) {
    const bad = r.health === "launch-failed", warn = r.health === "not-started" || r.health === "quiet";
    const card = el("div", { className: `card${bad ? " bad" : warn ? " warn" : ""}` });
    const row = el("div", { className: "row" }, el("span", { className: "id", textContent: r.id }), el("span", { className: "meta", textContent: r.kind === "review" ? `review of ${r.reviewOf}` : "work" }), el("span", { textContent: r.state }),
      el("span", { className: `health-${r.health}`, textContent: r.health }));
    const link = safeLink(r.sessionUrl, "session on claude.ai");
    if (link) row.append(link);
    row.append(toolCommitBadge(r));
    const pr = safeLink(r.prUrl, "pull request");
    if (pr) row.append(pr); else if (r.prOpening) row.append(el("span", { className: "meta", textContent: "opening pull request…" }));
    if (r.kind !== "review" && r.reviewJobId) {
      const text = r.reviewVerdict ? `review: ${r.reviewVerdict}` : r.reviewError ? "review did not complete" : "review running…";
      row.append(el("span", { className: r.reviewVerdict === "blocking issues" || r.reviewError ? "health-launch-failed" : "meta", textContent: text }));
      const c = safeLink(r.reviewCommentUrl, "review comment");
      if (c) row.append(c);
    }
    card.append(row);
    if (r.reviewError) card.append(el("div", { className: "latest health-launch-failed", textContent: `Review: ${r.reviewError}` }));
    if (r.prError) card.append(el("div", { className: "latest health-launch-failed", textContent: `Pull request not opened: ${r.prError}` }));
    if (r.launchError) card.append(el("div", { className: "latest health-launch-failed", textContent: r.launchError }));
    card.append(el("div", { className: "latest" }, ...linkify(r.latest?.text || (r.latest ? `${r.latest.type}${r.latest.status ? ": " + r.latest.status : ""}` : "No report yet"), el)));
    const reported = r.latest ? `reported ${ago(r.latest.at)} through ${r.latest.via === "git" ? "git" : "the API"}` : `launched ${ago(r.launchedAt)}; nothing reported`;
    card.append(el("div", { className: "meta", textContent: reported + (r.pendingSteers ? ` · ${r.pendingSteers} steer(s) waiting` : "") }));
    card.append(el("button", { type: "button", className: "open", textContent: "Open", onclick: () => { openJob = r.id; steerNote = ""; refreshJobs(); } }));
    return card;
  }

  function proposalBox(p) {
    const holder = el("div", { className: "card" });
    showProposal(holder, p);
    const box = holder.querySelector(".proposal");
    // After an answer, drop the card on the next refresh instead of leaving a stale Confirm button.
    box.addEventListener("click", () => setTimeout(refreshJobs, 1500));
    return holder;
  }

  let steerDraft = "", steerNote = "";
  async function renderDetail(id) {
    const res = await fetch(`/jobs/${encodeURIComponent(id)}`);
    if (!res.ok) { openJob = null; return renderList(); }
    const j = await res.json();
    const existing = jobsBox.querySelector("textarea.steer");
    if (existing) steerDraft = existing.value;
    const events = el("div", { className: "card" }, ...(j.events.length ? [...j.events].reverse().slice(0, 100).map((ev) =>
      el("div", { className: "ev" }, ...linkify(`${ago(ev.at)} · ${ev.type}${ev.status ? " " + ev.status : ""} · ${ev.via === "git" ? "git" : "API"}${ev.text ? "\n" + ev.text : ""}`, el))) : [el("div", { className: "empty", textContent: "No events yet." })]));
    const steers = el("div", { className: "card" }, ...(j.steers.length ? [...j.steers].reverse().map((s) =>
      el("div", { className: "ev" }, ...linkify(`#${s.n} · ${ago(s.at)} · ${s.deliveredAt ? "picked up " + ago(s.deliveredAt) : "waiting for the runner"}\n${s.text}`, el))) : [el("div", { className: "empty", textContent: "No steers yet." })]));
    const area = el("textarea", { className: "steer", rows: 3, placeholder: "Steer this job. It picks the message up at its next check-in." });
    area.value = steerDraft;
    const status = el("div", { className: "meta", textContent: steerNote });
    const send = el("button", { type: "button", textContent: "Send steer" });
    send.addEventListener("click", async () => {
      const text = area.value.trim();
      if (!text) return;
      send.disabled = true;
      try {
        const r = await fetch(`/jobs/${encodeURIComponent(id)}/steer`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
        const b = await r.json();
        if (!r.ok) { steerNote = status.textContent = `Not sent: ${b.error}`; }
        else { steerDraft = ""; area.value = ""; steerNote = status.textContent = `Steer ${b.n} queued.`; refreshJobs(); }
      } catch { status.textContent = "ORBIT did not answer."; }
      send.disabled = false;
    });
    const head = el("div", { className: "card" + (j.health === "launch-failed" ? " bad" : "") },
      el("div", { className: "row" }, el("span", { className: "id", textContent: j.id }), el("span", { textContent: j.state }), el("span", { className: `health-${j.health}`, textContent: j.health }),
        ...[safeLink(j.launch?.sessionUrl, "session on claude.ai"), safeLink(j.pr?.url, "pull request")].filter(Boolean), toolCommitBadge(j)),
      ...(j.pr?.error ? [el("div", { className: "latest health-launch-failed", textContent: `Pull request not opened: ${j.pr.error}` })] : []));
    jobsBox.replaceChildren(
      el("button", { type: "button", className: "back", textContent: "← All jobs", onclick: () => { openJob = null; refreshJobs(); } }),
      head, el("h2", { textContent: "Steer" }), el("div", { className: "card steerbox" }, area, send, status),
      el("h2", { textContent: "Steers" }), steers, el("h2", { textContent: "Events (newest first)" }), events);
  }

  async function renderList() {
    const [jr, pr] = await Promise.all([fetch("/jobs?view=rows"), fetch("/chat/proposals")]);
    if (!jr.ok) { tabs.hidden = true; setTab("chat"); return; }
    const rows = (await jr.json()).jobs;
    const proposals = pr.ok ? (await pr.json()).proposals : [];
    const attention = rows.filter((r) => ["not-started", "quiet", "launch-failed"].includes(r.health)).length + proposals.length;
    document.getElementById("jobsbadge").textContent = attention ? `(${attention})` : "";
    jobsBox.replaceChildren(
      ...(proposals.length ? [el("h2", { textContent: `Waiting for your click (${proposals.length})` }), ...proposals.map(proposalBox)] : []),
      el("h2", { textContent: `Jobs (${rows.length})` }),
      ...(rows.length ? rows.map(jobCard) : [el("div", { className: "empty", textContent: "No jobs yet." })]));
  }

  // <notes>
  // Pure helpers for the inbox and for runner text. Runner text is only ever inserted as text nodes and real <a>
  // elements built with textContent; no HTML parsing is involved.
  const NOTES_SHOWN = 3;
  function firstLine(text) {
    const lines = String(text ?? "").split("\n");
    const i = lines.findIndex((l) => l.trim());
    if (i < 0) return { first: "", rest: "" };
    return { first: lines[i].trim(), rest: lines.slice(i + 1).join("\n").trim() };
  }
  // Splits text into strings and https:// links. Only https links become <a>; anything else stays plain text.
  function linkify(text, mk) {
    const out = [];
    const src = String(text ?? "");
    const re = /https:\/\/[^\s<>"'`]+/g;
    let last = 0, m;
    while ((m = re.exec(src))) {
      let url = m[0];
      let tail = "";
      while (/[.,;:!?)\]}]$/.test(url)) { tail = url.slice(-1) + tail; url = url.slice(0, -1); }
      let ok = false;
      try { const u = new URL(url); ok = u.protocol === "https:" && !!u.hostname; } catch { /* plain text */ }
      if (!ok) continue;
      if (m.index > last) out.push(src.slice(last, m.index));
      out.push(mk("a", { href: url, target: "_blank", rel: "noopener noreferrer", textContent: url }));
      last = m.index + url.length;
      re.lastIndex = last;
    }
    if (last < src.length) out.push(src.slice(last));
    return out;
  }
  // The notes to show: undismissed ones, newest first, at most NOTES_SHOWN unless all are asked for.
  function pickNotes(notes, dismissed, all) {
    const live = notes.filter((n) => !dismissed.has(n.id)).slice().reverse();
    return { shown: all ? live : live.slice(0, NOTES_SHOWN), total: live.length };
  }
  // </notes>

  // <threads>
  // Pure helpers for the thread view. Stored text is only ever put in with textContent or the safe linkify above; nothing here
  // parses HTML. Tests load this block (with the notes block) on its own.
  const CARD_STATE_TEXT = { open: "Waiting for your click", confirmed: "Confirmed", cancelled: "Cancelled", expired: "Expired: nothing was done", refused: "Refused: nothing was done" };
  function threadOption(t) {
    return `${t.title}${t.archived ? " (archived)" : ""}${t.openCards ? ` · ${t.openCards} waiting` : ""}${t.busy ? " · replying…" : ""}`;
  }
  function cardTitle(card) {
    const what = card.kind === "vault_edit" ? `vault change: ${card.summary || card.action}` : card.kind === "job_steer" ? `steer for job ${card.job}` : card.kind === "job_launch" ? `job on routine "${card.routine}"` : `server action: ${card.summary || card.action}`;
    return [`Proposed ${what}. ${CARD_STATE_TEXT[card.state] || card.state}.`];
  }
  // What a decided card says. The live line comes from ORBIT's own job and operation records at the time the thread was
  // loaded; a confirmed card never says "done" on its own.
  function cardStateNodes(card, mk) {
    const out = [];
    const line = (text, cls) => out.push(mk("div", { className: `cardstate${cls ? " " + cls : ""}`, textContent: text }));
    if (card.state === "confirmed") {
      const id = card.outcome?.jobId || card.outcome?.opId;
      if (card.kind === "job_steer") line(card.outcome?.steerN ? `Steer ${card.outcome.steerN} queued for ${card.job}.` : "Confirmed, but no result was recorded.");
      else if (card.kind === "vault_edit" && card.outcome?.commit) line(`Committed and pushed: commit ${card.outcome.commit.slice(0, 7)} (the remote branch was read back and matches).`);
      else if (id) line(`${card.kind === "job_launch" ? "Job" : "Operation"} ${id}`);
      else line("Confirmed, but no job or operation id was recorded (ORBIT may have restarted). Check the Jobs tab; do not assume it ran.", "bad");
      if (card.outcome?.error) line(`Problem: ${card.outcome.error}`, "bad");
      const l = card.live;
      if (l) {
        if (!l.found) line(`${l.detail || "No record found."}`, "bad");
        else line(`Record now (${l.source}): ${l.state}${l.health ? ` · ${l.health}` : ""}${l.detail ? ` · ${l.detail}` : ""}. Only "verified" or a finished job state means the work is confirmed.`);
      }
    } else if (card.outcome?.error) line(card.outcome.error, "bad");
    for (const d of card.duplicates || []) line(`Possible duplicate: ${Math.round(d.similarity * 100)}% similar to job ${d.job} (${d.state}).`, "bad");
    if (card.state !== "confirmed" && card.state !== "open") line(CARD_STATE_TEXT[card.state] || card.state);
    return out;
  }
  function compactionNode(view, mk) {
    const s = view.summary;
    const kids = [`${s.covers} earlier message(s) are summarized for the model (${s.method === "model" ? "model-written" : "mechanical digest"}). All of them are kept and shown above.`];
    const node = mk("div", { className: "compact" }, ...kids);
    if (s.degraded) node.append(mk("div", { className: "warn", textContent: s.degraded }));
    const det = mk("details", {}, mk("summary", { textContent: "Summary the model sees" }), mk("pre", { textContent: s.text }));
    node.append(det);
    return node;
  }
  function renderStoredMessage(m, mk, cardFor) {
    const node = mk("div", { className: `msg ${m.role === "user" ? "user" : "orbit"}` });
    const text = m.status === "pending" ? "Working…" : m.text || (m.error ? "" : m.role === "assistant" ? "(no text)" : "");
    node.append(...linkify(text, mk));
    const mem = m.memory && m.memory.length ? ` · memory: ${m.memory.join(", ")}` : "";
    const tag = m.status === "error" || m.status === "interrupted" ? `${m.status}: ${m.error || ""}` : m.role === "assistant" && m.provenance ? `${m.provenance} · ${m.source}${mem}` : "";
    if (tag) node.append(mk("span", { className: `tag ${m.status === "error" || m.status === "interrupted" ? "down" : m.provenance || ""}`, textContent: tag }));
    if (m.calls && m.calls.length) {
      const box = mk("span", { className: "calls" }, `Tool calls (${m.calls.length}):`);
      for (const c of m.calls) box.append(mk("div", { textContent: `${c.ok ? "✓" : "✗"} ${c.name}(${String(c.arguments).slice(0, 120)}) [${c.ok ? `${c.provenance} · ${c.source}` : "failed"}] ${String(c.summary).slice(0, 160)}` }));
      node.append(box);
    }
    for (const id of m.cards || []) { const c = cardFor && cardFor(id); if (c) node.append(c); }
    return node;
  }
  // </threads>

  // <poller>
  // Runs `refresh` when `shouldRun()` says so, never two at once. Tests load this block on its own.
  function makePoller(refresh, shouldRun, schedule, ms) {
    let busy = false;
    const poll = async () => {
      if (busy || !shouldRun()) return;
      busy = true;
      try { await refresh(); } finally { busy = false; }
    };
    return { poll, start: () => schedule(poll, ms) };
  }
  // </poller>

  // Fetches and draws the Jobs tab. Called by the poller and by the user's own clicks on that tab.
  async function refreshJobs() {
    try {
      if (openJob) await renderDetail(openJob); else await renderList();
    } catch { /* the next refresh tries again */ }
  }
  // The Jobs tab refreshes once when it opens and every 15 seconds while it is showing and the page is visible.
  // The Chat tab and a hidden page make no jobs requests.
  const jobsPoller = makePoller(refreshJobs, () => tab === "jobs" && document.visibilityState === "visible", setInterval, 15000);
  jobsPoller.start();

  // The tabs show only for the owner. /chat/proposals is owner-only and cheap, so it answers that once on load
  // without touching the jobs list; the badge fills in when the Jobs tab opens.
  (async () => {
    try {
      const pr = await fetch("/chat/proposals");
      tabs.hidden = !pr.ok;
      if (pr.ok) { const n = (await pr.json()).proposals.length; document.getElementById("jobsbadge").textContent = n ? `(${n})` : ""; }
    } catch { /* stay on Chat */ }
  })();

  refreshStatus();
  initThreads();
  // Another device's messages and card changes show up within 10 seconds while the Chat tab is visible. Never two polls at once.
  makePoller(pollThreads, () => threadMode === "server" && !sending && tab === "chat" && document.visibilityState === "visible", setInterval, 10000).start();
  refreshInbox();
  refreshSignin();
  setInterval(refreshStatus, 30000);
  setInterval(refreshInbox, 30000);
</script>
</body>
</html>
