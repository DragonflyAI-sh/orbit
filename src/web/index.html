<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)">
<title>ORBIT</title>
<link rel="icon" href="/avatar.png">
<link rel="apple-touch-icon" href="/avatar.png">
<style>
  /* Colors from the ORBIT avatar: deep space, violet and electric-blue ribbons, gold filaments. */
  :root {
    --bg: #f4f2fb; --bg-glow: rgba(124, 92, 230, 0.14); --fg: #1c1838; --muted: #5d5880;
    --line: #dcd6f0; --card: #ffffff; --accent: #6d4fd8; --accent-2: #2f8fd6; --on-accent: #ffffff;
    --live: #1b7fb8; --mock: #9a6a00; --down: #c2334d; --gold: #c9921f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080a1a; --bg-glow: rgba(124, 92, 230, 0.22); --fg: #e9e6ff; --muted: #9c97c4;
      --line: #252a4d; --card: #11142b; --accent: #8b6cf0; --accent-2: #6fc3ff; --on-accent: #0b0d1f;
      --live: #6fc3ff; --mock: #f2c46d; --down: #ff7a8a; --gold: #f2c46d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, var(--bg-glow), transparent 70%), var(--bg);
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .brand img { width: 30px; height: 30px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1px var(--line), 0 0 12px var(--bg-glow); }
  h1 {
    margin: 0; font-size: 16px; letter-spacing: .18em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #ports { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--card); }
  .pill::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: currentColor; vertical-align: middle; }
  .live { color: var(--live); } .mock { color: var(--mock); } .degraded, .down { color: var(--down); }
  #inbox { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; }
  .note { border-left: 3px solid var(--gold); padding: 4px 8px; background: var(--card); border-radius: 4px; overflow-wrap: anywhere; }
  .note .top { display: flex; gap: 6px; align-items: flex-start; }
  .note .first { flex: 1; min-width: 0; }
  .note .rest { margin-top: 4px; white-space: pre-wrap; font-size: 14px; }
  .note button { flex: none; background: none; border: 0; padding: 2px 6px; min-height: 24px; color: var(--accent-2); font: inherit; font-size: 13px; cursor: pointer; }
  .note button.x { color: var(--muted); font-size: 16px; line-height: 1; }
  .note a, .ev a, .latest a { color: var(--accent-2); }
  #inbox .showall { align-self: flex-start; background: none; border: 0; padding: 2px 0; color: var(--accent-2); font: inherit; font-size: 13px; cursor: pointer; }
  #threadbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  #threadbar select { flex: 1 1 160px; min-width: 0; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  #threadbar button { padding: 5px 12px; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  #threadbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  #tstatus { flex: 1 1 100%; font-size: 12px; color: var(--muted); }
  #tstatus:empty { display: none; }
  #log[aria-busy="true"] { opacity: 0.6; }
  .banner { align-self: stretch; max-width: 720px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--gold); background: var(--card); font-size: 14px; overflow-wrap: anywhere; }
  .banner button { margin-top: 6px; padding: 4px 12px; display: block; }
  .compact { align-self: stretch; max-width: 720px; padding: 6px 10px; border-radius: 10px; border: 1px dashed var(--line); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .compact pre { white-space: pre-wrap; margin: 4px 0 0; font: 12px/1.4 ui-monospace, monospace; max-height: 50vh; overflow: auto; overscroll-behavior: contain; }
  .msg .warn { color: var(--mock); font-weight: 600; margin-top: .3rem; }
  .compact .warn, .dup { color: var(--mock); font-weight: 600; }
  .cardstate { margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; }
  .cardstate .ok { color: var(--live); } .cardstate .bad { color: var(--down); }
  .proposal.closed { border-color: var(--line); }
  #signin:not(:empty) { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  #signin button { padding: 4px 12px; margin-top: 4px; }
  #signin code { font-size: 16px; letter-spacing: .12em; color: var(--gold); }
  #signin a { color: var(--accent-2); }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  /* A message never grows past the log's width: long words and URLs wrap, wide code and tables scroll inside it. */
  .msg { max-width: min(720px, 100%); min-width: 0; padding: 8px 12px; border-radius: 12px; background: var(--card);
         border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .msg a { color: var(--accent-2); overflow-wrap: anywhere; }
  .msg.user a { color: inherit; text-decoration: underline; }
  .tag { display: block; font-size: 11px; margin-top: 4px; }
  .calls { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .calls div { margin-top: 2px; }
  .proposal { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--gold); border-radius: 8px; background: var(--bg); }
  .proposal pre { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; overscroll-behavior: contain; font: 12px/1.4 ui-monospace, monospace; }
  .proposal button { padding: 4px 12px; margin-right: 6px; }
  .proposal button.cancel { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  nav a { padding: 4px 14px; border-radius: 10px; background: var(--card); color: var(--fg); border: 1px solid var(--line); text-decoration: none; }
  nav a[aria-current="page"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); border-color: transparent; }
  nav a:hover { box-shadow: 0 0 0 2px var(--ring); }
  nav a:active { transform: translateY(1px); }
  nav .kind { font: 600 10px/1 ui-monospace, monospace; letter-spacing: .06em; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
  #jobs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #jobs h2 { margin: 6px 0 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card { max-width: 720px; width: 100%; min-width: 0; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .card.bad { border-color: var(--down); }
  .card.warn { border-color: var(--mock); }
  .card .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .card .id { font: 600 13px ui-monospace, monospace; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .latest { margin-top: 4px; font-size: 14px; }
  .card a { color: var(--accent-2); }
  .card button.open { margin-top: 6px; padding: 4px 12px; }
  .health-not-started, .health-quiet { color: var(--mock); font-weight: 600; }
  .health-launch-failed { color: var(--down); font-weight: 600; }
  .health-ok { color: var(--live); }
  .ev { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); white-space: pre-wrap; }
  .ev:first-child { border-top: 0; }
  #jobs textarea { width: 100%; }
  #jobs .steerbox { display: flex; flex-direction: column; gap: 6px; }
  #jobs .steerbox button { align-self: flex-start; padding: 6px 16px; }
  #jobs button.back, #jobs button.cancel { background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 4px 12px; align-self: flex-start; }
  #jobs .empty { color: var(--muted); }
  @media (max-width: 480px) { #jobs, #log { padding: 12px; } .card { padding: 8px 10px; } }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 0 16px; border-radius: 10px; border: 0; color: var(--on-accent);
           background: linear-gradient(135deg, var(--accent), var(--accent-2)); }

  /* Markdown replies (see the markdown block in the script). Paragraph line breaks are kept, as in plain replies. */
  .md { white-space: pre-line; min-width: 0; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md .scrollx, .md hr { margin: .5em 0; }
  .md h3, .md h4, .md h5, .md h6 { margin: .8em 0 .3em; line-height: 1.3; }
  .md h3 { font-size: 1.15em; } .md h4 { font-size: 1.05em; } .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li + li { margin-top: .2em; }
  .md li > ul, .md li > ol { margin: .2em 0; }
  .md blockquote { margin-left: 0; margin-right: 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  .md code { font: .9em/1.4 ui-monospace, monospace; padding: 0 3px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
  .md pre { margin: 0; padding: 8px 10px; white-space: pre; overflow-wrap: normal; width: max-content; min-width: 100%; }
  .md pre code { padding: 0; border: 0; background: none; font-size: 12.5px; }
  .md table { border-collapse: collapse; font-size: 13px; white-space: normal; overflow-wrap: normal; }
  .md th, .md td { padding: 4px 8px; border: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 5em; }
  .md th { background: var(--card); }
  .md .al-center { text-align: center; } .md .al-right { text-align: right; }
  /* Wide or very long content scrolls inside its own region (focusable, so the keyboard can scroll it) instead of
     widening the page or hiding text. */
  .scrollx { max-width: 100%; max-height: 60vh; overflow: auto; overscroll-behavior: contain; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .card .scrollx pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, monospace; }

  /* Button states, shared by every button: a visible hover ring, a pressed look while the mouse is down, a focus ring
     for keyboard users only, a clearly inert disabled state, and no motion for people who ask for reduced motion. */
  :root { --ring: color-mix(in srgb, var(--accent-2) 50%, transparent); --press-bg: color-mix(in srgb, var(--accent) 16%, transparent); }
  button { cursor: pointer; transition: filter .12s ease, box-shadow .12s ease, transform .08s ease, background-color .12s ease; }
  button:not(:disabled):hover { filter: brightness(1.08); box-shadow: 0 0 0 2px var(--ring); }
  button:not(:disabled):active { filter: brightness(.9); transform: translateY(1px) scale(.97); box-shadow: 0 0 0 2px var(--ring), inset 0 2px 4px rgba(0, 0, 0, .25); }
  .note button:not(:disabled):hover, .note button:not(:disabled):active, #inbox .showall:not(:disabled):hover, #inbox .showall:not(:disabled):active { background: var(--press-bg); box-shadow: none; text-decoration: underline; }
  button:disabled { cursor: not-allowed; opacity: .5; filter: grayscale(.4); box-shadow: none; transform: none; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, .scrollx:focus-visible, pre[tabindex]:focus-visible {
    outline: 2px solid var(--accent-2); outline-offset: 2px;
  }
  nav a { transition: box-shadow .12s ease, transform .08s ease; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    button:not(:disabled):active, nav a:active { transform: none; }
  }
</style>
</head>
<body>
<header><div class="brand"><img src="/avatar.png" alt=""><h1>ORBIT</h1></div><nav id="tabs" aria-label="ORBIT pages"><a href="/#chat" data-tab="chat" aria-current="page">Chat</a><a href="/#jobs" data-tab="jobs" id="jobstab" hidden>Jobs <span id="jobsbadge"></span></a><a href="/status" id="statuslink" title="ORBIT's status as raw JSON: running commit, deploy and port states">Status <span class="kind">JSON</span></a></nav><div id="threadbar" hidden><select id="threadsel" aria-label="Thread"></select><button type="button" id="tnew">New</button><button type="button" id="trename">Rename</button><button type="button" id="tarchive">Archive</button><label><input type="checkbox" id="tshowarch"> archived</label><span id="tstatus" role="status" aria-live="polite"></span></div><div id="ports"></div><div id="signin"></div><div id="inbox"></div></header>
<main id="log"></main>
<section id="jobs" hidden aria-live="off"></section>
<form id="form"><textarea id="input" rows="2" placeholder="Message ORBIT" aria-label="Message ORBIT" required></textarea><button id="send">Send</button></form>
<script>
  const history = [];
  const log = document.getElementById("log");

  async function refreshStatus() {
    try {
      const s = await (await fetch("/status")).json();
      const box = document.getElementById("ports");
      box.replaceChildren(...s.ports.map((p) => {
        const el = document.createElement("span");
        el.className = `pill ${p.state}`;
        el.textContent = `${p.port}: ${p.state}`;
        el.title = p.detail;
        return el;
      }));
    } catch { /* the next refresh tries again */ }
  }

  function showCalls(el, calls) {
    if (!calls?.length) return;
    const box = document.createElement("span");
    box.className = "calls";
    box.append(`Tool calls (${calls.length}):`);
    for (const c of calls) {
      const row = document.createElement("div");
      const src = callState(c);
      row.textContent = `${c.ok ? "✓" : c.outcomeUnknown ? "?" : "✗"} ${c.name}(${JSON.stringify(c.args).slice(0, 120)}) [${src}] ${c.summary.slice(0, 160)}`;
      box.append(row);
    }
    el.append(box);
  }

  function showProposal(el, p, after) {
    const box = document.createElement("div");
    box.className = "proposal";
    const head = document.createElement("div");
    const steer = p.kind === "job_steer";
    const sysop = p.kind === "ops_sys";
    const vault = p.kind === "vault_edit";
    const ops = p.kind === "ops_admin" || sysop || vault;
    head.textContent = vault ? `Proposed vault change: ${p.summary} Nothing has been written yet.` : ops ? `Proposed server action: ${p.summary} Nothing has been done yet.` : steer ? `Proposed steer for job ${p.job}. Nothing has been sent yet.` : `Proposed job on routine "${p.routine}". Nothing has launched yet.`;
    const brief = document.createElement("pre");
    brief.tabIndex = 0;
    brief.textContent = vault ? `${Object.entries(p.display || {}).map(([k, v]) => `${k}: ${v}`).join("\n")}\n\ndigest ${p.digest.slice(0, 16)}` : sysop ? `${p.display ? Object.entries(p.display).map(([k, v]) => `${k}=${v}`).join("\n") : p.action}\n\n${(p.warnings || []).map((w) => `! ${w}`).join("\n\n")}\n\ndigest ${p.digest.slice(0, 16)}` : ops ? (p.display ? Object.entries(p.display).map(([k, v]) => `${k}=${v}`).join("\n") : p.action) + `\n\ndigest ${p.digest.slice(0, 16)}`  : steer ? p.text : p.brief + (p.context && p.context.length ? "\n\n! This proposal names vault context from an older ORBIT build. Launch-time vault context is no longer supported, so confirming it will be refused; ask for a new launch that names the notes in the brief." : "");
    const status = document.createElement("div");
    const dups = (p.duplicates || []).map((d) => Object.assign(document.createElement("div"), { className: "dup", textContent: `Possible duplicate: this brief is ${Math.round(d.similarity * 100)}% similar to job ${d.job} (${d.state}), launched ${d.launchedAt || "recently"}. Check before confirming.` }));
    // The answer replaces the buttons; a keyboard user who pressed one lands on the answer instead of the page body.
    let hadFocus = false;
    const done = (text) => {
      const result = Object.assign(document.createElement("div"), { textContent: text, tabIndex: -1 });
      box.replaceChildren(head, brief, result);
      if (hadFocus) result.focus({ preventScroll: true });
      if (after) after();
    };
    const act = async (verb) => {
      hadFocus = box.contains(document.activeElement);
      confirm.disabled = cancel.disabled = true;
      try {
        const res = await fetch(`/chat/proposals/${p.id}/${verb}`, ops && verb === "confirm"
          ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ digest: p.digest }) }
          : { method: "POST" });
        const body = await res.json();
        if (!res.ok) return done(`${verb === "confirm" ? (ops ? (vault ? "Not saved" : "Not dispatched") : steer ? "Steer failed" : "Launch failed") : "Not cancelled"}: ${body.error}`);
        done(verb === "cancel" ? "Cancelled." : vault ? `Committed and pushed. ORBIT read the remote branch back: it points at commit ${String(body.commit).slice(0, 7)}.` : ops ? "Dispatched to the server helper. This is NOT verified yet: ORBIT will report the verified result when it has it (ask it for the operations)." : steer ? `Steer ${body.steer.n} queued for ${body.steered}; the job picks it up at its next check-in.` : `Launched job ${body.id}${body.launch?.sessionUrl ? " · " + body.launch.sessionUrl : ""}. Ask ORBIT for its status.`);
      } catch { done("ORBIT did not answer."); }
    };
    const confirm = Object.assign(document.createElement("button"), { type: "button", textContent: "Confirm" });
    const cancel = Object.assign(document.createElement("button"), { type: "button", textContent: "Cancel", className: "cancel" });
    confirm.addEventListener("click", () => act("confirm"));
    cancel.addEventListener("click", () => act("cancel"));
    box.append(head, ...dups, brief, confirm, cancel, status);
    el.append(box);
  }

  function add(role, text, tag, tagClass, extra) {
    const node = document.createElement("div");
    node.className = `msg ${role}`;
    // A model reply (it has a reply record) is Markdown, built without HTML parsing; everything else is plain text.
    if (extra?.reply) node.append(renderMarkdown(text, el)); else node.textContent = text;
    if (tag) {
      const t = document.createElement("span");
      t.className = `tag ${tagClass}`;
      t.textContent = tag;
      node.append(t);
    }
    const inc = extra?.reply?.incomplete;
    if (inc && inc.length) { const a = document.createElement("div"); a.className = "warn"; a.textContent = `Incomplete reply: ${inc.join("; ")}`; node.append(a); }
    const acct = extra?.reply?.accounting;
    if (acct && acct.length) { const a = document.createElement("div"); a.className = "warn"; a.textContent = `Spend accounting: ${acct.join("; ")}`; node.append(a); }
    if (extra) { showCalls(node, extra.calls); for (const p of extra.proposals ?? []) showProposal(node, p); }
    log.append(node);
    log.scrollTop = log.scrollHeight;
  }

  // ---- Threads (owner): stored on the server, shared by every device. The page keeps only the selected id (per device). ----
  const THREAD_KEY = "orbit.thread";
  let threadMode = null;      // null until known; "server" for the owner, "legacy" for anyone else (no stored history)
  let threadList = [];
  let current = null;         // the thread being shown, as the server sent it
  let sending = false;
  let showArchived = false;
  let barSig = "";
  // Explicit navigation (picking a thread, New, Archive) beats background refreshes. Each one bumps navGen synchronously
  // and sets `pending` until its answer is in; only the answer of the latest navigation may draw or report a failure,
  // a refresh that started before it is dropped, and nothing is sent while one is pending. navError says why the last
  // navigation failed (the page keeps showing the thread it had).
  let navGen = 0;
  let pending = null;         // { gen, id (null for New), title } while a navigation has not settled
  let navError = "";
  // Mutations of the open thread (Rename, Archive's archived state, a send's reply) are not navigations, but they answer
  // after an await too. `owns(target, gen)` says whether such an answer may still draw: no newer navigation (navGen is
  // what it was when the request left), none pending, and the thread drawn is still the one the request was about.
  // Otherwise the answer only refreshes the list (titles, archived flags) and never moves the menu, the log or the
  // stored selection.
  const owns = (targetId, gen) => gen === navGen && !pending && current?.id === targetId && shownThreadId === targetId;
  // For tests (test/chat-browser.test.ts waits on it); the page itself reads `pending`.
  function navPending() { return Boolean(pending); }
  const tsel = document.getElementById("threadsel");
  const readSel = () => { try { return localStorage.getItem(THREAD_KEY); } catch { return null; } };
  const writeSel = (id) => { try { id ? localStorage.setItem(THREAD_KEY, id) : localStorage.removeItem(THREAD_KEY); } catch { /* per-device convenience only */ } };

  async function tapi(path, method, body) {
    const res = await fetch(path, method === "GET" ? undefined : { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
    let data = {};
    try { data = await res.json(); } catch { /* not JSON */ }
    return { ok: res.ok, status: res.status, data };
  }

  function renderBar() {
    // The menu shows where the reader is going (a pending navigation), otherwise the thread that is drawn.
    const sel = pending?.id ?? current?.id ?? null;
    const rows = threadList.filter((t) => showArchived || !t.archived || t.id === current?.id || t.id === sel);
    // The options are rebuilt only when they changed, so a poll does not reset the menu while it has focus.
    const optionsSig = JSON.stringify([sel, rows.map((t) => [t.id, threadOption(t)])]);
    if (optionsSig !== barSig) {
      barSig = optionsSig;
      tsel.replaceChildren(...rows.map((t) => Object.assign(document.createElement("option"), { value: t.id, textContent: threadOption(t), selected: t.id === sel })));
      if (!rows.length) tsel.append(Object.assign(document.createElement("option"), { value: "", textContent: "No threads yet" }));
    }
    // The signature can match while the menu does not: the reader picked an option and that navigation failed or was

  const CARD_STATE_TEXT = { open: "Waiting for your click", confirmed: "Confirmed", cancelled: "Cancelled", expired: "Expired: nothing was done", refused: "Refused: nothing was done" };
  function threadOption(t) {
    return `${t.title}${t.archived ? " (archived)" : ""}${t.openCards ? ` · ${t.openCards} waiting` : ""}${t.busy ? " · replying…" : ""}`;
  }
  function cardTitle(card) {
    const what = card.kind === "vault_edit" ? `vault change: ${card.summary || card.action}` : card.kind === "job_steer" ? `steer for job ${card.job}` : card.kind === "job_launch" ? `job on routine "${card.routine}"` : `server action: ${card.summary || card.action}`;
    return [`Proposed ${what}. ${CARD_STATE_TEXT[card.state] || card.state}.`];
  }
  // What a decided card says. The live line comes from ORBIT's own job and operation records at the time the thread was
  // loaded; a confirmed card never says "done" on its own.
  function cardStateNodes(card, mk) {
    const out = [];
    const line = (text, cls) => out.push(mk("div", { className: `cardstate${cls ? " " + cls : ""}`, textContent: text }));
    if (card.state === "confirmed") {
      const id = card.outcome?.jobId || card.outcome?.opId;
      if (card.kind === "job_steer") line(card.outcome?.steerN ? `Steer ${card.outcome.steerN} queued for ${card.job}.` : "Confirmed, but no result was recorded.");
      else if (card.kind === "vault_edit" && card.outcome?.commit) line(`Committed and pushed: commit ${card.outcome.commit.slice(0, 7)} (the remote branch was read back and matches).`);
      else if (id) line(`${card.kind === "job_launch" ? "Job" : "Operation"} ${id}`);
      else line("Confirmed, but no job or operation id was recorded (ORBIT may have restarted). Check the Jobs tab; do not assume it ran.", "bad");
      if (card.outcome?.error) line(`Problem: ${card.outcome.error}`, "bad");
      const l = card.live;
      if (l) {
        if (!l.found) line(`${l.detail || "No record found."}`, "bad");
        else line(`Record now (${l.source}): ${l.state}${l.health ? ` · ${l.health}` : ""}${l.detail ? ` · ${l.detail}` : ""}. Only "verified" or a finished job state means the work is confirmed.`);
      }
    } else if (card.outcome?.error) line(card.outcome.error, "bad");
    for (const d of card.duplicates || []) line(`Possible duplicate: ${Math.round(d.similarity * 100)}% similar to job ${d.job} (${d.state}).`, "bad");
    if (card.state !== "confirmed" && card.state !== "open") line(CARD_STATE_TEXT[card.state] || card.state);
    return out;
  }
  function compactionNode(view, mk) {
    const s = view.summary;
    if (view.summaryUnusable) {
      // A stored summary with no text is not used: the model gets the whole thread instead. Say so rather than show an empty block.
      return mk("div", { className: "compact" }, mk("div", { className: "warn", textContent: `A stored summary of ${s.covers} earlier message(s) is empty, so it is NOT used and nothing was hidden: the model is sent the full thread. ORBIT replaces it the next time the thread is compacted.` }));
    }
    const kids = [`${s.covers} earlier message(s) are summarized for the model (${s.method === "model" ? "model-written" : "mechanical digest"}). All of them are kept and shown above.`];
    const node = mk("div", { className: "compact" }, ...kids);
    if (s.degraded) node.append(mk("div", { className: "warn", textContent: `Degraded: ${s.degraded}` }));
    const det = mk("details", {}, mk("summary", { textContent: "Summary the model sees" }), mk("pre", { tabIndex: 0, textContent: s.text }));
    node.append(det);
    return node;
  }
  const messageClass = (m) => `msg ${m.role === "user" ? "user" : "orbit"}`;
  // A stored message as separately keyed parts (body, tag, warnings, tool calls, one per card). Each part carries a
  // signature of exactly the data it shows, so the page can keep every part whose data did not change (and the text the
  // reader has selected in it) and rebuild only the part that did. `cardSpec(id)` gives a card's { sig, build } or null.
  function messageParts(m, mk, cardSpec) {
    const parts = [];
    const pending = m.status === "pending";
    const text = pending ? "Working…" : m.text || (m.error ? "" : m.role === "assistant" ? "(no text)" : "");
    // A finished reply is Markdown (rendered without any HTML parsing, see the markdown block); the user's own text, a
    // pending placeholder and error text stay plain.
    const markdown = m.role === "assistant" && !pending && Boolean(m.text);
    parts.push({ key: "body", sig: JSON.stringify([markdown, markdown ? m.text : text]), build: () => (markdown ? renderMarkdown(m.text, mk) : mk("span", { className: "body" }, ...linkify(text, mk))) });
    const mem = m.memory && m.memory.length ? ` · memory: ${m.memory.join(", ")}` : "";
    const failed = m.status === "error" || m.status === "interrupted";
    const tag = failed ? `${m.status}: ${m.error || ""}` : m.role === "assistant" && m.provenance ? `${m.provenance} · ${m.source}${mem}` : "";
    if (tag) {
      const tagText = m.fallback && m.status === "done" ? `⚠ Fallback model, not ChatGPT · ${tag}` : tag;
      const tagClass = `tag ${failed ? "down" : m.provenance || ""}`;
      parts.push({ key: "tag", sig: JSON.stringify([tagClass, tagText]), build: () => mk("span", { className: tagClass, textContent: tagText }) });
    }
    const warn = (key, t) => parts.push({ key, sig: t, build: () => mk("div", { className: "warn", textContent: t }) });
    if (m.incomplete && m.incomplete.length) warn("incomplete", `Incomplete reply: ${m.incomplete.join("; ")}`);
    if (m.accounting && m.accounting.length) warn("accounting", `Spend accounting: ${m.accounting.join("; ")}`);
    if (m.calls && m.calls.length) {
      const rows = m.calls.map((c) => `${c.ok ? "✓" : c.outcomeUnknown ? "?" : "✗"} ${c.name}(${String(c.arguments).slice(0, 120)}) [${callState(c)}] ${String(c.summary).slice(0, 160)}`);
      parts.push({ key: "calls", sig: JSON.stringify(rows), build: () => mk("span", { className: "calls" }, `Tool calls (${rows.length}):`, ...rows.map((r) => mk("div", { textContent: r }))) });
    }
    for (const id of m.cards || []) { const c = cardSpec && cardSpec(id); if (c) parts.push({ key: `card:${id}`, sig: c.sig, build: c.build }); }
    return parts;
  }
  function renderStoredMessage(m, mk, cardFor) {
    const node = mk("div", { className: messageClass(m) });
    for (const p of messageParts(m, mk, (id) => { const c = cardFor && cardFor(id); return c ? { sig: "", build: () => c } : null; })) node.append(p.build());
    return node;
  }
  // </threads>

  // <reconcile>
  // Brings `parent`'s children in line with `specs` ([{ key, sig, build(), update?(node) }], in order) while touching as
  // little as possible: a child whose key and signature are unchanged is left exactly where it is (its text, the
  // reader's selection in it, its focus, its scroll position and its event handlers all survive); a changed child is
  // updated in place when the spec can (`update`) or else replaced by a fresh build; children no longer wanted are
  // removed first, so kept children never need to move; new children are inserted at their place. `meta` (a WeakMap)
  // remembers each child's key and signature; children it does not know (an optimistic "Working…" bubble, an old
  // thread's nodes) are removed. `onReplace(old, fresh, swap)`, when given, must call `swap()` to make a replacement. Tests load this block on its own.
  function reconcileChildren(parent, specs, meta, onReplace) {
    const seen = new Set();
    const list = specs.filter((s) => !seen.has(s.key) && seen.add(s.key));
    const have = new Map();
    for (const n of Array.from(parent.childNodes)) {
      const k = meta.get(n)?.key;
      if (k !== undefined && seen.has(k) && !have.has(k)) have.set(k, n); else parent.removeChild(n);
    }
    let ref = parent.firstChild;
    let built = 0, replaced = 0, updated = 0;
    for (const s of list) {
      let node = have.get(s.key);
      const info = node && meta.get(node);
      if (node && info.sig !== s.sig) {
        if (s.update) { s.update(node); info.sig = s.sig; updated++; }
        else {
          const fresh = s.build();
          meta.set(fresh, { key: s.key, sig: s.sig });
          const swap = () => parent.replaceChild(fresh, node);
          if (onReplace) onReplace(node, fresh, swap); else swap();
          if (ref === node) ref = fresh;
          node = fresh; replaced++;
        }
      }
      if (!node) { node = s.build(); meta.set(node, { key: s.key, sig: s.sig }); built++; }
      if (node === ref) ref = ref.nextSibling; else parent.insertBefore(node, ref);
    }
    return { built, replaced, updated };
  }
  // </reconcile>

  // <poller>
  // Runs `refresh` when `shouldRun()` says so, never two at once. Tests load this block on its own.
  function makePoller(refresh, shouldRun, schedule, ms) {
    let busy = false;
    const poll = async () => {
      if (busy || !shouldRun()) return;
      busy = true;
      try { await refresh(); } finally { busy = false; }
    };
    return { poll, start: () => schedule(poll, ms) };
  }
  // </poller>

  // Fetches and draws the Jobs tab. Called by the poller and by the user's own clicks on that tab.
  async function refreshJobs() {
    try {
      if (openJob) await renderDetail(openJob); else await renderList();
    } catch { /* the next refresh tries again */ }
  }
  // The Jobs tab refreshes once when it opens and every 15 seconds while it is showing and the page is visible.
  // The Chat tab and a hidden page make no jobs requests.
  const jobsPoller = makePoller(refreshJobs, () => tab === "jobs" && document.visibilityState === "visible", setInterval, 15000);
  jobsPoller.start();

  // The Jobs link shows only for the owner. /chat/proposals is owner-only and cheap, so it answers that once on load
  // without touching the jobs list; the badge fills in when the Jobs tab opens. Chat and the public status link always show.
  (async () => {
    try {
      const pr = await fetch("/chat/proposals");
      jobsTab.hidden = !pr.ok;
      if (pr.ok) { const n = (await pr.json()).proposals.length; document.getElementById("jobsbadge").textContent = n ? `(${n})` : ""; }
      if (tabFromHash() !== tab) setTab(tabFromHash());
    } catch { /* stay on Chat */ }
  })();

  refreshStatus();
  initThreads();
  // Another device's messages and card changes show up within 10 seconds while the Chat tab is visible. Never two polls at once.
  makePoller(pollThreads, () => threadMode === "server" && !sending && tab === "chat" && document.visibilityState === "visible", setInterval, 10000).start();
  refreshInbox();
  refreshSignin();
  setInterval(refreshStatus, 30000);
  setInterval(refreshInbox, 30000);
</script>
</body>
</html>
