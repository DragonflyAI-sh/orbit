<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIT</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #ddddd8; --card: #fff;
          --live: #1f7a4d; --mock: #9a6700; --down: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ececea; --muted: #9b9b95; --line: #2e2e2b; --card: #1e1e1c;
            --live: #4cc38a; --mock: #e0b341; --down: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: .08em; }
  #ports { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .live { color: var(--live); } .mock { color: var(--mock); } .degraded, .down { color: var(--down); }
  #inbox { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .note { border-left: 3px solid var(--mock); padding: 4px 8px; background: var(--card); border-radius: 4px; white-space: pre-wrap; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 720px; padding: 8px 12px; border-radius: 10px; background: var(--card);
         border: 1px solid var(--line); white-space: pre-wrap; }
  .user { align-self: flex-end; }
  .tag { display: block; font-size: 11px; margin-top: 4px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); }
  button { font: inherit; padding: 0 16px; border-radius: 8px; border: 0; background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
<header><h1>ORBIT</h1><div id="ports"></div><div id="inbox"></div></header>
<main id="log"></main>
<form id="form"><textarea id="input" rows="2" placeholder="Message ORBIT" required></textarea><button>Send</button></form>
<script>
  const history = [];
  const log = document.getElementById("log");

  async function refreshStatus() {
    try {
      const s = await (await fetch("/status")).json();
      const box = document.getElementById("ports");
      box.replaceChildren(...s.ports.map((p) => {
        const el = document.createElement("span");
        el.className = `pill ${p.state}`;
        el.textContent = `${p.port}: ${p.state}`;
        el.title = p.detail;
        return el;
      }));
    } catch { /* the next refresh tries again */ }
  }

  function add(role, text, tag, tagClass) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    if (tag) {
      const t = document.createElement("span");
      t.className = `tag ${tagClass}`;
      t.textContent = tag;
      el.append(t);
    }
    log.append(el);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const content = input.value.trim();
    if (!content) return;
    input.value = "";
    history.push({ role: "user", content });
    add("user", content);
    try {
      const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" },
                                          body: JSON.stringify({ messages: history.slice(-40) }) });
      const body = await res.json();
      if (!res.ok) { add("orbit", body.error, "error", "down"); history.pop(); return; }
      history.push({ role: "assistant", content: body.reply.value });
      const mem = body.memory?.length ? ` · memory: ${body.memory.join(", ")}` : "";
      add("orbit", body.reply.value, `${body.reply.provenance} · ${body.reply.source}${mem}`, body.reply.provenance);
    } catch { add("orbit", "ORBIT did not answer.", "error", "down"); history.pop(); }
    refreshStatus();
  });

  document.getElementById("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  });
  // Shows due notifications, then acknowledges each so ORBIT records a shown receipt.
  async function refreshInbox() {
    try {
      const res = await fetch("/notifications");
      if (!res.ok) return;
      const { inbox } = await res.json();
      for (const n of inbox) {
        const el = document.createElement("div");
        el.className = "note";
        el.textContent = n.text;
        document.getElementById("inbox").append(el);
        await fetch(`/notifications/${n.id}/ack`, { method: "POST" });
      }
    } catch { /* the next refresh tries again */ }
  }

  refreshStatus();
  refreshInbox();
  setInterval(refreshStatus, 30000);
  setInterval(refreshInbox, 30000);
</script>
</body>
</html>
