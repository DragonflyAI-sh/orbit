name: Delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    needs: checks
    runs-on: ubuntu-latest
    concurrency: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --build-arg "ORBIT_COMMIT=${GITHUB_SHA}" -t "$image" .
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy, smoke test, roll back on failure
        run: |
          tailscale ssh "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            bash -s -- "${{ steps.image.outputs.ref }}" "${GITHUB_SHA}" "${{ vars.DEPLOY_BIND }}" < deploy/deploy.sh
